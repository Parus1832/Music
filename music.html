<button id="b">フォルダを選ぶ</button>
<pre id="o"></pre>
<script>
const o = document.getElementById('o');
o.textContent = 'showDirectoryPicker: ' + ('showDirectoryPicker' in window);
document.getElementById('b').onclick = async () => {
  const dir = await window.showDirectoryPicker();
  const names = [];
  for await (const [name, h] of dir.entries()) names.push(name);
  o.textContent += '\n' + names.slice(0, 20).join('\n');
};
</script>
